[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.2"]
build-backend = "scikit_build_core.build"

[project]
name = "pymeshlab2"
version = "0.0.1"
description = "Phase A scaffold for a nanobind-based QMeshLab-compatible MeshSet API"
readme = {file = "README", content-type = "text/x-rst"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]

[tool.scikit-build]
wheel.packages = ["python/pymeshlab2"]
